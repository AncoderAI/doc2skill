name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install release tools
        run: | # zizmor: ignore[adhoc-packages] npm 11.19.0 is pinned and required for OIDC publishing.
          npm install --global npm@11.19.0
          npm ci --ignore-scripts
          pip install pytest ruff

      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          python_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json v${package_version}" >&2
            exit 1
          fi
          if [[ "${python_version}" != "${package_version}" ]]; then
            echo "pyproject.toml ${python_version} does not match package.json ${package_version}" >&2
            exit 1
          fi

      - name: Run release gates
        run: |
          npm run verify:npm
          pytest tests/ -q
          ruff check --select E9,F --target-version py310 book_to_skill/ scripts/ tests/ tools/
          python3 tools/validate_skill.py SKILL.md
          npm pack --dry-run --json

      - name: Ensure version is not already published
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if npm view "book-to-skill@${package_version}" version >/dev/null 2>&1; then
            echo "book-to-skill@${package_version} is already published" >&2
            exit 1
          fi

      - name: Select npm dist-tag
        id: npm-tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          npm_tag="latest"
          if [[ "${package_version}" == *-* ]]; then
            prerelease="${package_version#*-}"
            npm_tag="${prerelease%%.*}"
          fi
          if [[ ! "${npm_tag}" =~ ^[a-zA-Z][a-zA-Z0-9._-]*$ ]]; then
            echo "invalid npm dist-tag derived from ${package_version}: ${npm_tag}" >&2
            exit 1
          fi
          echo "Publishing ${package_version} with npm dist-tag ${npm_tag}"
          echo "value=${npm_tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish public package
        # Authentication is supplied by npm Trusted Publishing. The npm CLI
        # exchanges GitHub's short-lived OIDC token; no NPM_TOKEN is stored.
        env:
          NPM_DIST_TAG: ${{ steps.npm-tag.outputs.value }}
        run: npm publish --access public --tag "${NPM_DIST_TAG}"
