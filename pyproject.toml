[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-to-skill"
version = "1.5.0-beta.5"
description = "Convert books and documents into structured, on-demand agent skills."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
book-to-skill = "book_to_skill.cli:main"
book-to-skill-pdf2md = "book_to_skill.pdf2md.cli:main"

[project.optional-dependencies]
epub = ["ebooklib", "beautifulsoup4"]
pdf = ["pypdf", "pdfminer.six"]
docx = ["python-docx"]
rtf = ["striprtf"]
technical = ["docling"]
pdf2md = [
    "pypdf",
    "pdfminer.six",
    "pypdfium2",
    "pdfplumber",
    "Pillow",
    "pytesseract",
]
pdf2md-technical = [
    "book-to-skill[pdf2md]",
    "docling",
]
pdf2md-eval = [
    "book-to-skill[pdf2md]",
    "markitdown",
    "firecrawl-anydoc",
    "pytest",
]
# Optional CV table path for scanned / borderless pages (not a hard dependency).
pdf2md-scan-tables = [
    "book-to-skill[pdf2md]",
    "img2table",
    "opencv-python-headless",
]
all = [
    "ebooklib",
    "beautifulsoup4",
    "pypdf",
    "pdfminer.six",
    "python-docx",
    "striprtf",
    "docling",
    "pypdfium2",
    "pdfplumber",
    "Pillow",
    "pytesseract",
]


# Tooling config so `ruff check .` and `pytest` locally match CI without flags.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# High-value gate only: syntax errors (E9) + pyflakes (F). Style stays ungated.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/pdf2md/* import book_to_skill as a package. Bare `pytest` (console script)
# does not put the rootdir on sys.path the way `python -m pytest` does, so CI would
# fail collection while local runs passed. Pin it here so both agree.
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["book_to_skill"]

[tool.hatch.build.targets.wheel.force-include]
"references" = "references"
"book_to_skill/pdf2md/references" = "book_to_skill/pdf2md/references"
